<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="ccb-title ccb-desc">
  <title id="ccb-title">Birthday tier cake (illustrated concept)</title>
  <desc id="ccb-desc">A stylised two-tier birthday cake with pastel frosting, sprinkles and lit candles, shown as design inspiration only.</desc>
  <defs>
    <linearGradient id="ccb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f3ea"/><stop offset="1" stop-color="#ece2ce"/>
    </linearGradient>
    <radialGradient id="ccb-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d0c0b" stop-opacity="0.24"/><stop offset="0.7" stop-color="#0d0c0b" stop-opacity="0.08"/><stop offset="1" stop-color="#0d0c0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ccb-tier1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe1e7"/><stop offset="0.45" stop-color="#f4c9d5"/><stop offset="1" stop-color="#e5a2b5"/>
    </linearGradient>
    <linearGradient id="ccb-tier2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="0.5" stop-color="#fdedd2"/><stop offset="1" stop-color="#f6d8ab"/>
    </linearGradient>
    <linearGradient id="ccb-round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="ccb-flame-outer" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#ffd873"/><stop offset="0.55" stop-color="#f2a23f"/><stop offset="1" stop-color="#e0762a" stop-opacity="0.85"/>
    </radialGradient>
    <clipPath id="ccb-tier1-clip"><path d="M110 180 a90 20 0 0 0 180 0 v34 a90 20 0 0 1 -180 0z"/></clipPath>
    <clipPath id="ccb-tier2-clip"><path d="M150 130 a58 14 0 0 0 100 0 v30 a58 14 0 0 1 -100 0z"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#ccb-bg)"/>
  <ellipse cx="200" cy="254" rx="126" ry="15" fill="url(#ccb-shadow)"/>
  <ellipse cx="200" cy="240" rx="112" ry="18" fill="#ffffff" stroke="#ddd5c6"/>
  <ellipse cx="200" cy="237" rx="98" ry="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Bottom tier -->
  <path d="M110 180 a90 20 0 0 0 180 0 v34 a90 20 0 0 1 -180 0z" fill="url(#ccb-tier1)"/>
  <rect x="110" y="180" width="180" height="54" fill="url(#ccb-round)" clip-path="url(#ccb-tier1-clip)" style="mix-blend-mode:overlay"/>
  <ellipse cx="200" cy="180" rx="90" ry="20" fill="#fceaef"/>
  <path d="M110 196 a90 20 0 0 0 180 0" fill="none" stroke="#e7a8b8" stroke-width="2" opacity="0.55"/>

  <!-- Top tier -->
  <path d="M150 130 a58 14 0 0 0 100 0 v30 a58 14 0 0 1 -100 0z" fill="url(#ccb-tier2)"/>
  <rect x="150" y="130" width="100" height="44" fill="url(#ccb-round)" clip-path="url(#ccb-tier2-clip)" style="mix-blend-mode:overlay"/>
  <ellipse cx="200" cy="130" rx="50" ry="14" fill="#fffaf1"/>

  <!-- Sprinkles, with a small highlight dot each for a glossier finish -->
  <g stroke-linecap="round" stroke-width="4">
    <line x1="126" y1="176" x2="132" y2="182" stroke="#5c8a44"/>
    <line x1="150" y1="188" x2="144" y2="182" stroke="#2a5fa8"/>
    <line x1="170" y1="176" x2="176" y2="182" stroke="#e08a2a"/>
    <line x1="230" y1="184" x2="224" y2="178" stroke="#c23b3b"/>
    <line x1="252" y1="176" x2="258" y2="182" stroke="#5c8a44"/>
    <line x1="270" y1="188" x2="264" y2="182" stroke="#2a5fa8"/>
    <line x1="165" y1="122" x2="171" y2="128" stroke="#c23b3b"/>
    <line x1="188" y1="132" x2="182" y2="126" stroke="#e08a2a"/>
    <line x1="212" y1="122" x2="218" y2="128" stroke="#2a5fa8"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="129" cy="178" r="0.9"/><circle cx="147" cy="184" r="0.9"/><circle cx="173" cy="178" r="0.9"/>
    <circle cx="227" cy="180" r="0.9"/><circle cx="255" cy="178" r="0.9"/><circle cx="267" cy="184" r="0.9"/>
  </g>

  <!-- Candles, with a two-tone flame for a warmer, more dimensional glow -->
  <g>
    <rect x="184" y="96" width="6" height="26" rx="2" fill="#7fb3d5"/>
    <rect x="185.4" y="96" width="1.6" height="26" rx="0.8" fill="#ffffff" opacity="0.35"/>
    <rect x="197" y="90" width="6" height="32" rx="2" fill="#f2a244"/>
    <rect x="198.4" y="90" width="1.6" height="32" rx="0.8" fill="#ffffff" opacity="0.35"/>
    <rect x="210" y="96" width="6" height="26" rx="2" fill="#c23b3b"/>
    <rect x="211.4" y="96" width="1.6" height="26" rx="0.8" fill="#ffffff" opacity="0.35"/>
    <path d="M187 96 q3.4 -8 0 -15 q3.4 7 0 15z" fill="url(#ccb-flame-outer)"/>
    <path d="M200 90 q3.4 -8 0 -15 q3.4 7 0 15z" fill="url(#ccb-flame-outer)"/>
    <path d="M213 96 q3.4 -8 0 -15 q3.4 7 0 15z" fill="url(#ccb-flame-outer)"/>
    <ellipse cx="187" cy="93" rx="1.1" ry="2.2" fill="#fff6d8" opacity="0.85"/>
    <ellipse cx="200" cy="86" rx="1.1" ry="2.2" fill="#fff6d8" opacity="0.85"/>
    <ellipse cx="213" cy="93" rx="1.1" ry="2.2" fill="#fff6d8" opacity="0.85"/>
  </g>
</svg>
