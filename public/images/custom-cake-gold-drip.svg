<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="ccg-title ccg-desc">
  <title id="ccg-title">Gold drip celebration cake (illustrated concept)</title>
  <desc id="ccg-desc">A stylised dark chocolate cake with a golden drip glaze and macarons on top, shown as design inspiration only.</desc>
  <defs>
    <linearGradient id="ccg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f3ea"/><stop offset="1" stop-color="#ece2ce"/>
    </linearGradient>
    <radialGradient id="ccg-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d0c0b" stop-opacity="0.26"/><stop offset="0.7" stop-color="#0d0c0b" stop-opacity="0.09"/><stop offset="1" stop-color="#0d0c0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ccg-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3025"/><stop offset="0.5" stop-color="#2e1a13"/><stop offset="1" stop-color="#1a0e0a"/>
    </linearGradient>
    <linearGradient id="ccg-round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="ccg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d493"/><stop offset="0.5" stop-color="#e6b862"/><stop offset="1" stop-color="#b98a3a"/>
    </linearGradient>
    <linearGradient id="ccg-gold-drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9dc9e"/><stop offset="1" stop-color="#c99a48"/>
    </linearGradient>
    <clipPath id="ccg-body-clip"><path d="M96 158 a104 24 0 0 0 208 0 v50 a104 24 0 0 1 -208 0z"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#ccg-bg)"/>
  <ellipse cx="200" cy="252" rx="128" ry="15" fill="url(#ccg-shadow)"/>
  <ellipse cx="200" cy="238" rx="112" ry="18" fill="#ffffff" stroke="#ddd5c6"/>
  <ellipse cx="200" cy="235" rx="98" ry="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>

  <path d="M96 158 a104 24 0 0 0 208 0 v50 a104 24 0 0 1 -208 0z" fill="url(#ccg-body)"/>
  <rect x="96" y="158" width="208" height="74" fill="url(#ccg-round)" clip-path="url(#ccg-body-clip)" style="mix-blend-mode:overlay"/>
  <ellipse cx="200" cy="158" rx="104" ry="24" fill="url(#ccg-gold)"/>
  <ellipse cx="200" cy="153" rx="70" ry="11" fill="#ffffff" opacity="0.18"/>

  <!-- Gold drips, softened into smoother teardrop shapes with a subtle top highlight -->
  <g fill="url(#ccg-gold-drip)">
    <path d="M100 160 c8 6 16 10 22 12 c1 9 -4 15 -4 23 c0 7 5 10 5 16 c0 3 -2 5 -5.5 5 s-5.5 -2 -5.5 -5 c0 -6 -5 -9 -5 -16 c0 -8 3 -13 2 -21 c-3.5 -2.5 -6.5 -6 -9 -14z"/>
    <path d="M142 178 c4 7 3 13 3 19 c0 7 5 9 5 15 c0 3 -2.4 5 -5.5 5 s-5.5 -2 -5.5 -5 c0 -6 -5 -8 -5 -15 c0 -7 2 -12 0.5 -19 c2.5 1 5 1 7.5 0z"/>
    <path d="M182 184 c4 6 3 15 3 22 c0 8 5.5 10 5.5 17 c0 3.4 -2.6 5.5 -6 5.5 s-6 -2.1 -6 -5.5 c0 -7 -5.5 -9 -5.5 -17 c0 -9 2 -15 1 -23 c2.6 1.3 5.3 1.3 8 0z"/>
    <path d="M224 180 c4 7 3 11 3 17 c0 6 5 8 5 15 c0 3 -2.3 5 -5.5 5 s-5.5 -2 -5.5 -5 c0 -6 -5 -8 -5 -15 c0 -6 2 -10 0.5 -17 c2.5 1 5 1 7.5 0z"/>
    <path d="M264 176 c4 7 3 13 3 19 c0 7 5 9 5 15 c0 3 -2.4 5 -5.5 5 s-5.5 -2 -5.5 -5 c0 -6 -5 -8 -5 -15 c0 -7 2 -12 0.5 -19 c2.5 1 5 1 7.5 0z"/>
    <path d="M300 160 c-8 6 -16 10 -22 12 c-1 9 4 15 4 23 c0 7 -5 10 -5 16 c0 3 2 5 5.5 5 s5.5 -2 5.5 -5 c0 -6 5 -9 5 -16 c0 -8 -3 -13 -2 -21 c3.5 -2.5 6.5 -6 9 -14z"/>
  </g>
  <g fill="#fff3d4" opacity="0.45">
    <ellipse cx="118" cy="167" rx="4" ry="1.6"/><ellipse cx="147" cy="182" rx="3.4" ry="1.4"/>
    <ellipse cx="187" cy="188" rx="3.6" ry="1.4"/><ellipse cx="229" cy="184" rx="3.4" ry="1.4"/>
    <ellipse cx="269" cy="180" rx="3.4" ry="1.4"/><ellipse cx="282" cy="167" rx="4" ry="1.6"/>
  </g>

  <!-- Macarons on top, with a soft shine so they read as glossy shells rather than flat discs -->
  <g>
    <ellipse cx="176" cy="140" rx="16" ry="8" fill="#f0c8d0"/>
    <rect x="160" y="138" width="32" height="6" fill="#e9a9b8"/>
    <ellipse cx="176" cy="138" rx="16" ry="8" fill="#f8dee4"/>
    <ellipse cx="170" cy="135" rx="6" ry="2.6" fill="#ffffff" opacity="0.55"/>
  </g>
  <g>
    <ellipse cx="214" cy="138" rx="16" ry="8" fill="#cbb8e8"/>
    <rect x="198" y="136" width="32" height="6" fill="#b299d6"/>
    <ellipse cx="214" cy="136" rx="16" ry="8" fill="#e2d5f4"/>
    <ellipse cx="208" cy="133" rx="6" ry="2.6" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Gold leaf accents -->
  <g fill="url(#ccg-gold)" opacity="0.95">
    <polygon points="150,132 156,123 161,132 156,139"/>
    <polygon points="244,134 250,125 255,134 250,141"/>
  </g>
</svg>
