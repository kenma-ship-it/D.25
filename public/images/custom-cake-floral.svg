<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="ccf-title ccf-desc">
  <title id="ccf-title">Floral buttercream cake (illustrated concept)</title>
  <desc id="ccf-desc">A stylised ivory buttercream cake piped with soft pink and sage rosettes and sugar flowers, shown as design inspiration only.</desc>
  <defs>
    <linearGradient id="ccf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f3ea"/><stop offset="1" stop-color="#ece2ce"/>
    </linearGradient>
    <radialGradient id="ccf-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d0c0b" stop-opacity="0.22"/><stop offset="0.7" stop-color="#0d0c0b" stop-opacity="0.07"/><stop offset="1" stop-color="#0d0c0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ccf-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/><stop offset="0.5" stop-color="#fbf3e2"/><stop offset="1" stop-color="#f2e5c8"/>
    </linearGradient>
    <linearGradient id="ccf-round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="ccf-rosette-pink" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffe2ea"/><stop offset="1" stop-color="#e9a8bb"/>
    </radialGradient>
    <radialGradient id="ccf-rosette-sage" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#c3dab0"/><stop offset="1" stop-color="#8fac76"/>
    </radialGradient>
    <radialGradient id="ccf-rosette-blush" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f9dde6"/><stop offset="1" stop-color="#e6b6c8"/>
    </radialGradient>
    <clipPath id="ccf-body-clip"><path d="M100 168 a100 22 0 0 0 200 0 v42 a100 22 0 0 1 -200 0z"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#ccf-bg)"/>
  <ellipse cx="200" cy="252" rx="124" ry="15" fill="url(#ccf-shadow)"/>
  <ellipse cx="200" cy="238" rx="112" ry="18" fill="#ffffff" stroke="#ddd5c6"/>
  <ellipse cx="200" cy="236" rx="98" ry="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>

  <path d="M100 168 a100 22 0 0 0 200 0 v42 a100 22 0 0 1 -200 0z" fill="url(#ccf-body)"/>
  <rect x="100" y="168" width="200" height="64" fill="url(#ccf-round)" clip-path="url(#ccf-body-clip)" style="mix-blend-mode:overlay"/>
  <ellipse cx="200" cy="168" rx="100" ry="22" fill="#fffdf6"/>

  <!-- Piped texture lines -->
  <g stroke="#eee0c4" stroke-width="1.5" opacity="0.7" fill="none">
    <path d="M100 190 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
    <path d="M100 202 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
    <path d="M100 214 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" opacity="0.55"/>
  </g>

  <!-- Rosette border on top edge, each with a soft radial gradient for dimension -->
  <g>
    <circle cx="110" cy="164" r="10" fill="url(#ccf-rosette-pink)"/>
    <circle cx="132" cy="150" r="10" fill="url(#ccf-rosette-sage)"/>
    <circle cx="158" cy="142" r="10" fill="url(#ccf-rosette-pink)"/>
    <circle cx="200" cy="138" r="11" fill="url(#ccf-rosette-blush)"/>
    <circle cx="242" cy="142" r="10" fill="url(#ccf-rosette-pink)"/>
    <circle cx="268" cy="150" r="10" fill="url(#ccf-rosette-sage)"/>
    <circle cx="290" cy="164" r="10" fill="url(#ccf-rosette-pink)"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="107" cy="160" rx="3" ry="2"/><ellipse cx="129" cy="146" rx="3" ry="2"/>
    <ellipse cx="155" cy="138" rx="3" ry="2"/><ellipse cx="197" cy="134" rx="3.2" ry="2.1"/>
    <ellipse cx="239" cy="138" rx="3" ry="2"/><ellipse cx="265" cy="146" rx="3" ry="2"/><ellipse cx="287" cy="160" rx="3" ry="2"/>
  </g>
  <g fill="#c98298" opacity="0.55">
    <circle cx="110" cy="164" r="4"/><circle cx="158" cy="142" r="4"/>
    <circle cx="200" cy="138" r="4.5"/><circle cx="242" cy="142" r="4"/><circle cx="290" cy="164" r="4"/>
  </g>

  <!-- Sugar flowers accent -->
  <g>
    <g transform="translate(178,132)">
      <circle cx="-8" cy="0" r="6" fill="#f6e0e5"/><circle cx="8" cy="0" r="6" fill="#f6e0e5"/>
      <circle cx="0" cy="-8" r="6" fill="#f6e0e5"/><circle cx="0" cy="8" r="6" fill="#f6e0e5"/>
      <circle cx="0" cy="0" r="5" fill="#e6ab3f"/>
      <circle cx="-1.5" cy="-1.5" r="1.6" fill="#fff3cf" opacity="0.8"/>
    </g>
    <path d="M220 130 c6 -8 16 -8 18 0 c-6 4 -14 4 -18 0z" fill="#7a9a5c"/>
    <path d="M220 130 c3 -4 8 -4 9 0 c-3 2 -6 2 -9 0z" fill="#93b878" opacity="0.7"/>
  </g>
</svg>
